# Example inventory — copy to inventory.local.yml and fill in your host.
# inventory.local.yml is gitignored: real IPs, jump hosts, and usernames
# never belong in the tracked repo (this repo is public).
#
#   cp inventory.example.yml inventory.local.yml
#
# The IP below is a documentation placeholder (RFC 5737 TEST-NET).
#
# There is deliberately no "dev" group here. Local development is
# `bun run dev` on your own machine — entirely outside this inventory, so
# there is nothing a playbook run could ever point at by mistake.
#
# Two groups are defined:
#
#   pinmap_prod    — deploy.yml targets this. The live site.
#   pinmap_review  — deploy-review.yml targets this. A disposable slot for
#                    looking at a build before it goes live.
#
# They may point at the same machine (that's the common case — one box, two
# containers). Isolation between them is by container name, port, and source
# directory, which each playbook hard-codes; see deploy-review.yml's header
# for the table. Point pinmap_review at a different host instead if you'd
# rather keep review off the production machine entirely.
#
# The YAML anchors (&aorus4 / &conn and their *references) just avoid
# repeating the host and connection settings — delete them and write both
# groups out longhand if you find that clearer.

pinmap_prod:
  hosts:
    prodserver: &host { ansible_host: 192.0.2.10 }
  vars: &conn
    ansible_user: youruser
    # ProxyJump is optional — drop the line if you reach the host directly.
    # Baking it in here (rather than relying on ~/.ssh/config) means this
    # inventory works regardless of local SSH config state.
    ansible_ssh_common_args: >-
      -o ProxyJump=203.0.113.1
      -o ConnectTimeout=15
      -o StrictHostKeyChecking=accept-new

    # Required — see deploy.yml's header for why these can't just come from
    # a stray .env on the deploy machine. pinmap_web_mapbox_token must be a
    # token restricted to your production domain in the Mapbox dashboard,
    # not a bare unrestricted one.
    pinmap_web_mapbox_token: "pk...."
    pinmap_web_supabase_url: "https://your-project.supabase.co"
    pinmap_web_supabase_anon_key: "..."
    # Optional — only needed for the Imports/notify features.
    # pinmap_web_fb_import_upload_url: "https://your-host:8096"
    # pinmap_web_fb_import_relay_url: "https://your-host:8097"
    # pinmap_web_notify_relay_url: "https://your-host:..."

pinmap_review:
  hosts:
    prodserver: *host
  vars: *conn
