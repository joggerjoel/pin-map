server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # index.html must always be revalidated — it's what points browsers at
  # the current content-hashed bundle, so caching it stale serves an old
  # app after every deploy. The hashed assets it references are safe to
  # cache forever, since a new build always gets a new filename.
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
